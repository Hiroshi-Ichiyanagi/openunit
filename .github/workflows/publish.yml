# Publish Worldyard to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
# Runs only when a GitHub release is published. The upload job waits in the "pypi" environment,
# which requires the repository owner's approval on GitHub before anything reaches PyPI.
# Actions are pinned to commit SHAs of releases at least two weeks old (2026-10-26).
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: test, verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests and verification (standard library only)
        run: |
          python -m pip install pytest
          python -m pytest -q
          make verify
      - name: Check the release tag matches the project version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/worldyard/
    permissions:
      id-token: write  # mandatory for Trusted Publishing; this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
